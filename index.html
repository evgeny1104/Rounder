<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скруглитель фото</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Стили теперь не влияют на body страницы */
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    const { useState, useEffect, useCallback, useRef } = React;

    const MAX_FILE_SIZE_MB = 5;
    const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

    // Компонент иконки SVG
    const UploadIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="w-12 h-12 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
    );

    // Основной компонент приложения
    const App = () => {
      const [originalImage, setOriginalImage] = useState(null);
      const [processedImage, setProcessedImage] = useState(null);
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const canvasRef = useRef(null);
      const imageRef = useRef(null);

      const processImage = useCallback(() => {
        if (!imageRef.current) return;
        setIsLoading(true);

        setTimeout(() => {
            const image = imageRef.current;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            
            const size = Math.min(image.width, image.height);
            canvas.width = size;
            canvas.height = size;
            
            const radius = size / 2;

            ctx.clearRect(0, 0, size, size);
            ctx.beginPath();
            ctx.arc(radius, radius, radius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();
            
            const sx = (image.width - size) / 2;
            const sy = (image.height - size) / 2;
            
            ctx.drawImage(image, sx, sy, size, size, 0, 0, size, size);
            
            setProcessedImage(canvas.toDataURL('image/png'));
            setIsLoading(false);
        }, 10);
      }, []);

      useEffect(() => {
        if (!originalImage) return;

        const image = new Image();
        image.src = originalImage;
        image.onload = () => {
          imageRef.current = image;
          processImage();
        };
      }, [originalImage, processImage]);


      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError('');
        setOriginalImage(null);
        setProcessedImage(null);
        imageRef.current = null;

        if (!file.type.startsWith('image/')) {
          setError('Пожалуйста, загрузите действительный файл изображения (PNG, JPG, GIF и т.д.).');
          return;
        }

        if (file.size > MAX_FILE_SIZE_BYTES) {
          setError(`Файл слишком большой. Максимальный размер ${MAX_FILE_SIZE_MB} МБ.`);
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          setOriginalImage(event.target.result);
        };
        reader.onerror = () => {
          setError('Не удалось прочитать выбранный файл.');
        };
        reader.readAsDataURL(file);
      };
      
      const handleDownload = () => {
        if (!processedImage) return;
        
        const link = document.createElement('a');
        link.download = `skruglennoye-foto.png`;
        link.href = processedImage;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleReset = () => {
        setOriginalImage(null);
        setProcessedImage(null);
        imageRef.current = null;
        setError('');
        const fileInput = document.getElementById('file-upload');
        if (fileInput) fileInput.value = '';
      };
      
      return (
        <div className="font-sans py-1 flex justify-center">
            <div className="w-full max-w-4xl bg-white rounded-2xl shadow-2xl p-6 md:p-8 overflow-hidden">
                <canvas ref={canvasRef} style={{ display: 'none' }} />
                <div className="flex flex-col md:flex-row md:space-x-8">
                    
                    {/* Левая колонка / Загрузка */}
                    <div className={`w-full md:w-1/3 flex flex-col justify-center transition-all duration-300 ${originalImage ? 'md:w-1/3' : 'md:w-full'}`}>
                        <h1 className="text-2xl md:text-3xl font-bold text-gray-800 mb-2 text-center md:text-left">Скруглитель фото</h1>
                        <p className="text-gray-500 mb-6 text-center md:text-left">Загрузите изображение, чтобы сделать его идеально круглым.</p>
                        
                        {!originalImage && (
                          <label htmlFor="file-upload" className="relative cursor-pointer bg-gray-50 hover:bg-gray-100 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center transition-colors">
                            <UploadIcon />
                            <span className="mt-2 block text-sm font-semibold text-gray-600">Нажмите, чтобы загрузить изображение</span>
                            <span className="mt-1 block text-xs text-gray-500">PNG, JPG, GIF до {MAX_FILE_SIZE_MB} МБ</span>
                            <input id="file-upload" name="file-upload" type="file" className="sr-only" accept="image/*" onChange={handleFileChange} />
                          </label>
                        )}

                        {error && <div className="mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm" role="alert">{error}</div>}

                        {originalImage && (
                            <div className="space-y-6 mt-4">
                                <div className="flex flex-col space-y-3">
                                    <button
                                        onClick={handleDownload}
                                        disabled={!processedImage || isLoading}
                                        className="w-full inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-300 disabled:cursor-not-allowed"
                                    >
                                        Скачать изображение
                                    </button>
                                     <button
                                        onClick={handleReset}
                                        className="w-full inline-flex justify-center items-center px-6 py-3 border border-gray-300 text-base font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                                    >
                                        Загрузить другое
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* Правая колонка / Просмотр изображения */}
                    {originalImage && (
                        <div className="w-full md:w-2/3 mt-6 md:mt-0 flex items-center justify-center">
                           {isLoading ? (
                               <div className="w-full flex items-center justify-center rounded-lg p-4 min-h-[300px]">
                                   <div className="text-gray-500">Обработка...</div>
                               </div>
                           ) : processedImage && (
                                <div className="inline-block">
                                   <img
                                       src={processedImage}
                                       alt="Обработанное круглое изображение"
                                       className="max-w-full max-h-full object-contain"
                                       style={{ maxHeight: '60vh' }}
                                   />
                               </div>
                           )}
                        </div>
                    )}
                </div>
            </div>
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>
</body>
</html>
